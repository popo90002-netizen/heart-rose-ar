<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Heart Marker - Rose Bloom AR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  #status {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; font-family: sans-serif; font-size: 13px;
    background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 999px;
    z-index: 1000; pointer-events: none;
  }
</style>
</head>
<body>

<div id="status">초기화 중...</div>
<div id="container" style="width: 100vw; height: 100vh;"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
    "fflate": "https://esm.sh/fflate@0.8.2"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const statusEl = document.getElementById('status');

try {
  const mindarThree = new MindARThree({
    container: document.querySelector('#container'),
    imageTargetSrc: './targets.mind',
  });

  const { renderer, scene, camera } = mindarThree;

  scene.add(new THREE.AmbientLight(0xffffff, 1.9));
  const dirLight = new THREE.DirectionalLight(0xffffff, 2.1);
  dirLight.position.set(1, 3, 2);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xffe8e0, 1.1);
  fillLight.position.set(-2, 1, -1);
  scene.add(fillLight);

  // 여러 각도/거리에서 찍은 사진 5장으로 컴파일된 파일이라 타겟 0~4 전부 준비
  const anchors = [0, 1, 2, 3, 4].map(i => mindarThree.addAnchor(i));

  // ------------------------------------------------------------
  // 장미는 GLB 안에 포함된 재질/텍스처를 그대로 사용
  // (Sketchfab GLB - 별도 텍스처 파일 불필요)
  // ------------------------------------------------------------

  const COLOR_VARIANTS = [
    { name: 'red',    color: 0xffffff },
    { name: 'pink',   color: 0xffb7cf },
    { name: 'yellow', color: 0xffdf6b },
    { name: 'white',  color: 0xffffff },
  ];

  // ------------------------------------------------------------
  // 하트 바깥쪽 배치 좌표 (마커 평면 기준, 단위: 마커 가로폭 = 1)
  // 규칙적으로 안 보이도록 각 위치에 약간의 랜덤 흔들림(jitter)을 더함
  // ------------------------------------------------------------
  const BASE_LAYOUT = [
    // 하트 맨 위쪽 (두 봉우리 위)
    { x: -0.24, y:  0.47, z: 0.05, scaleMul: 0.9,  delay: 0.0  },
    { x:  0.24, y:  0.47, z: 0.05, scaleMul: 0.9,  delay: 0.25 },
    // 위쪽 옆 (봉우리 바깥쪽)
    { x: -0.51, y:  0.32, z: 0.05, scaleMul: 1.0,  delay: 0.5  },
    { x:  0.51, y:  0.32, z: 0.05, scaleMul: 1.0,  delay: 0.75 },
    // 중간 옆면
    { x: -0.60, y:  0.08, z: 0.05, scaleMul: 0.85, delay: 1.0  },
    { x:  0.60, y:  0.08, z: 0.05, scaleMul: 0.85, delay: 1.25 },
    // 중하단 옆면 (하트 몸통 옆, 바닥에 닿지 않는 높이까지만)
    { x: -0.51, y: -0.09, z: 0.05, scaleMul: 1.05, delay: 1.5  },
    { x:  0.51, y: -0.09, z: 0.05, scaleMul: 1.05, delay: 1.75 },
  ];
  function jitter(n) { return (Math.random() - 0.5) * n; }
  const LAYOUT = BASE_LAYOUT.map(pos => ({
    x: pos.x + jitter(0.08),
    y: pos.y + jitter(0.08),
    z: pos.z + jitter(0.03),
    scaleMul: pos.scaleMul * (0.85 + Math.random() * 0.3),
    delay: pos.delay + jitter(0.2),
  }));

  const BLOOM_DURATION = 0.9;

  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // 앵커(타겟)별로 각자의 장미 세트를 따로 가짐
  // 트래킹 떨림(jitter) 완화를 위해, 장미들은 anchor.group에 직접 붙이지 않고
  // scene에 별도로 둔 "smoothGroup"에 붙임. 매 프레임 앵커의 실제 위치를
  // 조금씩(lerp)만 따라가게 해서 미세한 흔들림을 걸러냄
  const anchorStates = anchors.map(a => {
    const smoothGroup = new THREE.Group();
    smoothGroup.visible = false;
    scene.add(smoothGroup);
    return { anchor: a, smoothGroup, roses: [], markerVisible: false, foundTime: null };
  });
  let modelReady = false;
  let loadedRose = null;

  const loader = new GLTFLoader();
  loader.load('./rose.glb', (gltf) => {
    loadedRose = gltf.scene;
    tryStartLoadingRoses();
  }, undefined, (err) => {
    statusEl.textContent = '모델 로드 실패: ' + (err.message || err);
    console.error('GLB load error:', err);
  });

  // GLB가 준비된 후 장미들을 생성
  function tryStartLoadingRoses() {
    if (!loadedRose) return;
    const rose = loadedRose;

    const box = new THREE.Box3().setFromObject(rose);
    const size = new THREE.Vector3();
    box.getSize(size);
    const autoScale = 0.32 / (size.y || 1);

    anchorStates.forEach(state => {
      LAYOUT.forEach(pos => {
        const group = new THREE.Group();
        const instance = rose.clone(true);

        // 장미마다 색상 변형을 랜덤 배정.
        // GLB에 들어있는 원본 텍스처는 유지하고 material.color로 가볍게 틴트.
        const variant = COLOR_VARIANTS[Math.floor(Math.random() * COLOR_VARIANTS.length)];

        instance.traverse(child => {
          if (child.isMesh && child.material) {
            const nameLower = (child.name + ' ' + (child.material.name || '')).toLowerCase();

            if (nameLower.includes('petal')) {
              child.material = child.material.clone();
              child.material.color.setHex(variant.color);
            }
          }
        });

        group.add(instance);
        group.position.set(pos.x, pos.y, pos.z);
        group.scale.setScalar(0.0001);
        state.smoothGroup.add(group);

        state.roses.push({
          group,
          targetScale: autoScale * pos.scaleMul,
          delay: pos.delay,
          spawned: false,
          startTime: null,
          tiltPhase: Math.random() * Math.PI * 2,
          tiltSpeed: 0.00035 + Math.random() * 0.00025,
          spinSpeed: 0.0025 + Math.random() * 0.0025,
          bobPhase: Math.random() * Math.PI * 2,
          bobSpeed: 0.0008 + Math.random() * 0.0006,
        });
      });
    });

    modelReady = true;
    statusEl.textContent = '준비 완료 - 하트를 비춰보세요';
  }

  anchorStates.forEach(state => {
    state.anchor.onTargetFound = () => {
      state.markerVisible = true;
      state.justFound = true;
      state.smoothGroup.visible = true;
      state.foundTime = performance.now();
      statusEl.textContent = '하트 인식됨 - 장미가 피어납니다';
      state.roses.forEach(r => { r.spawned = false; r.startTime = null; });
    };
    state.anchor.onTargetLost = () => {
      state.markerVisible = false;
      statusEl.textContent = '마커 인식 대기 중...';
      state.roses.forEach(r => { r.group.scale.setScalar(0.0001); r.spawned = false; });
    };
  });

  const start = async () => {
    statusEl.textContent = '카메라 시작 중...';
    try {
      await mindarThree.start();
    } catch (startErr) {
      statusEl.textContent = '카메라 시작 실패: ' + startErr.message;
      console.error(startErr);
      return;
    }

    // (캔버스 z-index/position 강제 코드는 검증된 예제들에 없었고
    //  오히려 부작용을 일으켰을 수 있어 제거함 - #container div 사용만으로 충분)

    statusEl.textContent = '마커 인식 대기 중...';

    renderer.setAnimationLoop(() => {
      // MindAR이 카메라 fov/aspect를 이따금 0으로 재계산하는 상황이 있어
      // 매 프레임 안전하게 정상값으로 고정
      let needsUpdate = false;
      if (!camera.fov || camera.fov < 1) { camera.fov = 60; needsUpdate = true; }
      const correctAspect = window.innerWidth / window.innerHeight;
      if (!camera.aspect || Math.abs(camera.aspect - correctAspect) > 0.01) {
        camera.aspect = correctAspect;
        needsUpdate = true;
      }
      if (needsUpdate) camera.updateProjectionMatrix();

      const now = performance.now();
      scene.updateMatrixWorld(true); // 앵커의 최신 트래킹 결과를 확실히 반영

      if (modelReady) {
        anchorStates.forEach(state => {
          if (!state.markerVisible) return;

          // [떨림 완화] 앵커의 실제 트래킹 위치를 매 프레임 조금씩만
          // 따라가게 해서(lerp/slerp) 미세한 흔들림을 걸러냄.
          // 방금 인식된 첫 프레임엔 바로 스냅해서 위치가 튀지 않게 함
          const targetPos = new THREE.Vector3();
          const targetQuat = new THREE.Quaternion();
          const targetScale = new THREE.Vector3();
          state.anchor.group.matrixWorld.decompose(targetPos, targetQuat, targetScale);

          if (state.justFound) {
            state.smoothGroup.position.copy(targetPos);
            state.smoothGroup.quaternion.copy(targetQuat);
            state.smoothGroup.scale.copy(targetScale);
            state.justFound = false;
          } else {
            const SMOOTH = 0.06; // 0~1: 낮을수록 부드럽지만 반응이 느려짐
            state.smoothGroup.position.lerp(targetPos, SMOOTH);
            state.smoothGroup.quaternion.slerp(targetQuat, SMOOTH);
            state.smoothGroup.scale.lerp(targetScale, SMOOTH);
          }

          state.roses.forEach(r => {
            if (!r.spawned) {
              const elapsedSinceFound = (now - state.foundTime) / 1000;
              if (elapsedSinceFound >= r.delay) {
                r.spawned = true;
                r.startTime = now;
              }
            }
            if (r.spawned) {
              const t = Math.min(1, (now - r.startTime) / 1000 / BLOOM_DURATION);
              const eased = easeOutBack(t);

              const bob = t >= 1 ? Math.sin(now * r.bobSpeed + r.bobPhase) * 0.04 : 0;
              r.group.scale.setScalar(Math.max(0.0001, r.targetScale * eased * (1 + bob)));

              r.group.rotation.y += r.spinSpeed;

              const TOP_TILT = Math.PI / 2.3;
              const ANGLE_TILT = -Math.PI / 7;
              const blend = (Math.sin(now * r.tiltSpeed + r.tiltPhase) + 1) / 2;
              r.group.rotation.x = TOP_TILT + (ANGLE_TILT - TOP_TILT) * blend;
            }
          });
        });
      }

      renderer.render(scene, camera);
    });
  };

  start();

} catch (err) {
  statusEl.textContent = '오류: ' + err.message;
  console.error(err);
}
</script>

</body>
</html>
